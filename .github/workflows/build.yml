name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  BINARY_SIZE_LIMIT_MB: 20

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: mr-nope
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: mr-nope
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: mr-nope
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: mr-nope.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Run tests
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check binary size (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          SIZE_BYTES=$(stat -f%z "$BINARY_PATH" 2>/dev/null || stat --format=%s "$BINARY_PATH")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          echo "Binary size: ${SIZE_MB} MB ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -gt "$((BINARY_SIZE_LIMIT_MB * 1048576))" ]; then
            echo "::error::Binary size ${SIZE_MB} MB exceeds limit of ${BINARY_SIZE_LIMIT_MB} MB"
            exit 1
          fi

      - name: Check binary size (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binaryPath = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $sizeBytes = (Get-Item $binaryPath).Length
          $sizeMB = [math]::Round($sizeBytes / 1MB, 2)
          Write-Host "Binary size: ${sizeMB} MB ($sizeBytes bytes)"
          $limitBytes = [int]$env:BINARY_SIZE_LIMIT_MB * 1MB
          if ($sizeBytes -gt $limitBytes) {
            Write-Error "Binary size ${sizeMB} MB exceeds limit of $env:BINARY_SIZE_LIMIT_MB MB"
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mr-nope-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
