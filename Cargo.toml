[package]
name = "mr-nope"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "properties"
path = "tests/properties/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
